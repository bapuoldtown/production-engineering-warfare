<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes control plane and data plane architecture</title><desc id="desc">kubectl sends requests to kube-apiserver, which persists accepted state in etcd. Controllers reconcile Deployments into ReplicaSets and Pods. Scheduler binds Pods to nodes. Kubelet and container runtime start workloads. CNI configures networking; kube-proxy or Cilium implements Service datapath; EndpointSlice controller publishes endpoints.</desc>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#426a70"/></marker><marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#0d8879"/></marker><style>
.h{font:700 27px system-ui;fill:#173b42}.sub{font:16px system-ui;fill:#527078}.node{fill:#fff;stroke:#b9d8d1;stroke-width:2;rx:15}.cp{fill:#eef7ff;stroke:#8db8d7}.dp{fill:#effaf3;stroke:#8dc8a7}.title{font:700 19px system-ui;fill:#173b42}.body{font:15px system-ui;fill:#49676d}.tiny{font:13px system-ui;fill:#59757a}.edge{stroke:#426a70;stroke-width:3;fill:none;marker-end:url(#arr)}.watch{stroke:#0d8879;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#arr2)}.pill{font:700 13px system-ui;fill:#087f73;letter-spacing:1px}</style></defs>
<rect width="1600" height="1040" rx="24" fill="#f8fcfa"/><text x="55" y="54" class="pill">KUBERNETES INTERNALS / MISSION 008.5</text><text x="55" y="94" class="h">Control plane decides. Data plane runs.</text><text x="55" y="124" class="sub">A request changes desired state; controllers reconcile it; node agents make workloads real.</text>
<rect x="55" y="175" width="190" height="112" class="node"/><text x="150" y="215" text-anchor="middle" class="title">kubectl</text><text x="150" y="244" text-anchor="middle" class="body">apply / patch /</text><text x="150" y="266" text-anchor="middle" class="body">delete / rollout</text>
<rect x="315" y="175" width="250" height="112" class="node cp"/><text x="440" y="215" text-anchor="middle" class="title">kube-apiserver</text><text x="440" y="244" text-anchor="middle" class="body">AuthN · AuthZ · Admission</text><text x="440" y="266" text-anchor="middle" class="body">Validation · API watch</text>
<rect x="665" y="175" width="205" height="112" class="node cp"/><text x="767" y="215" text-anchor="middle" class="title">etcd</text><text x="767" y="244" text-anchor="middle" class="body">Durable cluster state</text><text x="767" y="266" text-anchor="middle" class="body">Persist accepted objects</text>
<path d="M245 231 H315 M565 231 H665" class="edge"/><path d="M665 270 C620 330 530 330 490 287" class="watch"/>
<rect x="55" y="375" width="1490" height="245" rx="22" fill="#edf6fc" stroke="#9fc6df" stroke-width="2"/><text x="85" y="414" class="pill">CONTROL PLANE / CONTROL-PLANE NODE</text>
<rect x="90" y="450" width="340" height="125" class="node cp"/><text x="260" y="490" text-anchor="middle" class="title">kube-controller-manager</text><text x="260" y="520" text-anchor="middle" class="body">Deployment controller</text><text x="260" y="544" text-anchor="middle" class="body">ReplicaSet · Node · EndpointSlice</text>
<rect x="500" y="450" width="300" height="125" class="node cp"/><text x="650" y="490" text-anchor="middle" class="title">kube-scheduler</text><text x="650" y="520" text-anchor="middle" class="body">Filters and scores nodes</text><text x="650" y="544" text-anchor="middle" class="body">Binds Pod to selected node</text>
<rect x="870" y="450" width="270" height="125" class="node cp"/><text x="1005" y="490" text-anchor="middle" class="title">cloud-controller-manager</text><text x="1005" y="520" text-anchor="middle" class="body">Optional cloud integration</text><text x="1005" y="544" text-anchor="middle" class="body">Routes · volumes · nodes</text>
<rect x="1210" y="450" width="285" height="125" class="node cp"/><text x="1352" y="490" text-anchor="middle" class="title">Admission controllers</text><text x="1352" y="520" text-anchor="middle" class="body">Mutate / validate requests</text><text x="1352" y="544" text-anchor="middle" class="body">Run inside API request path</text>
<path d="M440 287 V350 H260 V450 M440 287 V350 H650 V450" class="watch"/>
<rect x="55" y="675" width="710" height="300" rx="22" fill="#effaf3" stroke="#9bcdae" stroke-width="2"/><text x="85" y="714" class="pill">DATA PLANE / WORKER NODE A</text>
<rect x="90" y="750" width="195" height="92" class="node dp"/><text x="187" y="785" text-anchor="middle" class="title">kubelet</text><text x="187" y="812" text-anchor="middle" class="body">Pod lifecycle agent</text>
