<rect x="545" y="750" width="185" height="92" class="node dp"/><text x="637" y="785" text-anchor="middle" class="title">CNI / Cilium</text><text x="637" y="812" text-anchor="middle" class="body">Pod networking</text>
<path d="M285 796 H320 M510 796 H545" class="edge"/>
<rect x="90" y="870" width="300" height="75" class="node dp"/><text x="240" y="900" text-anchor="middle" class="title">Application Pods</text><text x="240" y="925" text-anchor="middle" class="body">Containers · probes · volumes</text>
<rect x="420" y="870" width="310" height="75" class="node dp"/><text x="575" y="900" text-anchor="middle" class="title">Service datapath</text><text x="575" y="925" text-anchor="middle" class="body">kube-proxy OR Cilium replacement</text>
