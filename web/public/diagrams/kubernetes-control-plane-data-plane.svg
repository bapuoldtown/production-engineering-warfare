<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1740" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes end-to-end architecture: runtime, networking, storage, Services and StatefulSets</title>
<desc id="desc">Detailed cluster diagram showing control plane, kubelet CRI to containerd to shim and runc to Linux kernel, CNI networking, CSI storage controller and node plugins with StorageClass PVC PV and volume mounts, CoreDNS Services EndpointSlices kube-proxy or Cilium, and StatefulSet with headless Service and per-Pod claims.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#426a70"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#087f73"/></marker>
<style>
*{font-family:system-ui,Segoe UI,sans-serif}.bg{fill:#f8fcfa}.title{font-size:32px;font-weight:750;fill:#173b42}.sub{font-size:17px;fill:#527078}.zone{stroke-width:2;rx:22}.zcp{fill:#edf6fc;stroke:#9fc6df}.znode{fill:#effaf3;stroke:#9bcdae}.zstore{fill:#fff8e9;stroke:#e6c987}.znet{fill:#f3efff;stroke:#b9a9e3}.box{fill:#fff;stroke:#b9d8d1;stroke-width:2;rx:13}.blue{fill:#e5f3ff;stroke:#8db8d7}.green{fill:#e5f7eb;stroke:#8dc8a7}.gold{fill:#fff2cf;stroke:#e6c987}.violet{fill:#f0eaff;stroke:#b9a9e3}.h{font-size:19px;font-weight:700;fill:#173b42}.b{font-size:15px;fill:#49676d}.s{font-size:13px;fill:#59757a}.cap{font-size:14px;font-weight:750;letter-spacing:1.2px;fill:#087f73}.solid{stroke:#426a70;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#087f73;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#g)}.thin{stroke:#9bb7b2;stroke-width:2;fill:none}.white{fill:#fff}
</style></defs>
<rect width="2200" height="1740" class="bg"/>
<text x="55" y="58" class="cap">MISSION 008.5 / STAFF ENGINEER ARCHITECTURE GUIDE</text>
<text x="55" y="105" class="title">From YAML to process, persistent disk and network packet</text>
<text x="55" y="137" class="sub">Kubernetes coordinates four systems: desired state, container execution, persistent storage and Service networking.</text>

<!-- CONTROL PLANE -->
<rect x="45" y="175" width="2110" height="265" class="zone zcp"/>
<text x="75" y="213" class="cap">CONTROL PLANE — ACCEPTS DESIRED STATE AND RECONCILES IT</text>
<rect x="80" y="250" width="210" height="115" class="box"/><text x="185" y="290" text-anchor="middle" class="h">kubectl</text><text x="185" y="320" text-anchor="middle" class="b">apply / patch / delete</text><text x="185" y="342" text-anchor="middle" class="s">manifest → API request</text>
<rect x="370" y="250" width="290" height="115" class="box blue"/><text x="515" y="288" text-anchor="middle" class="h">kube-apiserver</text><text x="515" y="318" text-anchor="middle" class="b">AuthN · AuthZ · Admission</text><text x="515" y="342" text-anchor="middle" class="s">validates / exposes API / watches</text>
<rect x="740" y="250" width="210" height="115" class="box blue"/><text x="845" y="290" text-anchor="middle" class="h">etcd</text><text x="845" y="320" text-anchor="middle" class="b">Durable object state</text><text x="845" y="342" text-anchor="middle" class="s">stores accepted API data</text>
<rect x="1030" y="235" width="320" height="145" class="box blue"/><text x="1190" y="273" text-anchor="middle" class="h">Controller manager</text><text x="1190" y="305" text-anchor="middle" class="b">Deployment / ReplicaSet</text><text x="1190" y="329" text-anchor="middle" class="b">PV binding / EndpointSlice</text><text x="1190" y="353" text-anchor="middle" class="s">watches → reconciles → API writes</text>
<rect x="1430" y="250" width="250" height="115" class="box blue"/><text x="1555" y="290" text-anchor="middle" class="h">kube-scheduler</text><text x="1555" y="320" text-anchor="middle" class="b">selects node for Pod</text><text x="1555" y="342" text-anchor="middle" class="s">binds Pod through API</text>
<rect x="1760" y="250" width="340" height="115" class="box blue"/><text x="1930" y="290" text-anchor="middle" class="h">Storage + network APIs</text><text x="1930" y="320" text-anchor="middle" class="b">PVC / PV / Service / EndpointSlice</text><text x="1930" y="342" text-anchor="middle" class="s">declarative objects, not packet handlers</text>
<path d="M290 308 H370 M660 308 H740 M950 308 H1030 M1350 308 H1430 M1680 308 H1760" class="solid"/>
<text x="680" y="235" class="s">persist</text><text x="1365" y="235" class="s">unscheduled Pods</text>
<text x="1070" y="410" class="s">Dashed arrows below represent watches and reconciliation; controllers communicate through the API server.</text>

<!-- NODE EXECUTION -->
<rect x="45" y="475" width="1030" height="690" class="zone znode"/>
<text x="75" y="515" class="cap">WORKER NODE — POD SANDBOX AND CONTAINER EXECUTION</text>
<rect x="80" y="555" width="220" height="95" class="box blue"/><text x="190" y="592" text-anchor="middle" class="h">kubelet</text><text x="190" y="620" text-anchor="middle" class="b">node agent / Pod reconciler</text>
<rect x="360" y="555" width="210" height="95" class="box blue"/><text x="465" y="592" text-anchor="middle" class="h">CRI (gRPC)</text><text x="465" y="620" text-anchor="middle" class="b">runtime contract</text>
<rect x="630" y="555" width="370" height="95" class="box blue"/><text x="815" y="592" text-anchor="middle" class="h">containerd + CRI plugin</text><text x="815" y="620" text-anchor="middle" class="b">images · snapshots · sandbox · tasks</text>
<path d="M300 603 H360 M570 603 H630" class="solid"/>
<rect x="80" y="705" width="270" height="115" class="box green"/><text x="215" y="743" text-anchor="middle" class="h">Pod sandbox</text><text x="215" y="773" text-anchor="middle" class="b">pause container commonly</text><text x="215" y="795" text-anchor="middle" class="s">holds shared Pod network namespace</text>
<rect x="390" y="705" width="250" height="115" class="box green"/><text x="515" y="743" text-anchor="middle" class="h">CNI plugin chain</text><text x="515" y="773" text-anchor="middle" class="b">ADD / configure network</text><text x="515" y="795" text-anchor="middle" class="s">veth · IP · routes · policy datapath</text>
<rect x="680" y="705" width="320" height="115" class="box green"/><text x="840" y="743" text-anchor="middle" class="h">Image + container lifecycle</text><text x="840" y="773" text-anchor="middle" class="b">pull → create → start</text><text x="840" y="795" text-anchor="middle" class="s">containerd snapshotter / task</text>
<path d="M815 650 V675 H215 V705 M815 650 V675 H515 V705 M815 650 V705 H840" class="solid"/>
<rect x="80" y="875" width="270" height="115" class="box"/><text x="215" y="912" text-anchor="middle" class="h">containerd-shim</text><text x="215" y="942" text-anchor="middle" class="b">per-container/task shim</text><text x="215" y="964" text-anchor="middle" class="s">common runc v2 runtime shim</text>
<rect x="390" y="875" width="250" height="115" class="box"/><text x="515" y="912" text-anchor="middle" class="h">runc / OCI runtime</text><text x="515" y="942" text-anchor="middle" class="b">create namespaces / cgroups</text><text x="515" y="964" text-anchor="middle" class="s">mounts · capabilities · exec</text>
<rect x="680" y="875" width="320" height="115" class="box"/><text x="840" y="912" text-anchor="middle" class="h">Linux kernel</text><text x="840" y="942" text-anchor="middle" class="b">namespaces · cgroups · VFS</text><text x="840" y="964" text-anchor="middle" class="s">kernel runs the process</text>
<path d="M840 820 V845 H215 V875 M350 932 H390 M640 932 H680" class="solid"/>
<rect x="80" y="1040" width="920" height="90" class="box green"/><text x="540" y="1075" text-anchor="middle" class="h">Pod = one or more containers sharing Pod network namespace</text><text x="540" y="1105" text-anchor="middle" class="b">localhost shared · Pod IP shared · volumes can be mounted into selected containers</text>
<path d="M840 990 V1040" class="solid"/>

<!-- STORAGE -->
<rect x="1110" y="475" width="1045" height="690" class="zone zstore"/>
<text x="1140" y="515" class="cap">STORAGE — PVC REQUEST → PV BINDING → CSI MOUNT → CONTAINER PATH</text>
<rect x="1150" y="555" width="245" height="105" class="box gold"/><text x="1272" y="592" text-anchor="middle" class="h">Pod volume</text><text x="1272" y="622" text-anchor="middle" class="b">volumes + volumeMounts</text><text x="1272" y="643" text-anchor="middle" class="s">mountPath in container</text>
<rect x="1450" y="555" width="210" height="105" class="box gold"/><text x="1555" y="592" text-anchor="middle" class="h">PVC</text><text x="1555" y="622" text-anchor="middle" class="b">namespaced claim</text><text x="1555" y="643" text-anchor="middle" class="s">size / access / class</text>
<rect x="1715" y="555" width="190" height="105" class="box gold"/><text x="1810" y="592" text-anchor="middle" class="h">StorageClass</text><text x="1810" y="622" text-anchor="middle" class="b">provisioner + params</text><text x="1810" y="643" text-anchor="middle" class="s">dynamic provisioning</text>
<rect x="1960" y="555" width="155" height="105" class="box gold"/><text x="2037" y="592" text-anchor="middle" class="h">PV</text><text x="2037" y="622" text-anchor="middle" class="b">cluster resource</text><text x="2037" y="643" text-anchor="middle" class="s">bound volume</text>
<path d="M1395 608 H1450 M1660 608 H1715 M1905 608 H1960" class="solid"/>
<rect x="1150" y="720" width="430" height="125" class="box gold"/><text x="1365" y="758" text-anchor="middle" class="h">CSI controller plugin + sidecars</text><text x="1365" y="788" text-anchor="middle" class="b">external-provisioner / external-attacher</text><text x="1365" y="814" text-anchor="middle" class="s">CreateVolume · ControllerPublishVolume</text>
<rect x="1650" y="720" width="465" height="125" class="box gold"/><text x="1882" y="758" text-anchor="middle" class="h">CSI node plugin</text><text x="1882" y="788" text-anchor="middle" class="b">kubelet plugin socket on worker node</text><text x="1882" y="814" text-anchor="middle" class="s">NodeStageVolume · NodePublishVolume</text>
<path d="M1810 660 V690 H1365 V720 M2037 660 V690 H1882 V720" class="dash"/>
<rect x="1150" y="905" width="965" height="115" class="box gold"/><text x="1632" y="945" text-anchor="middle" class="h">Storage backend</text><text x="1632" y="975" text-anchor="middle" class="b">cloud block disk · network filesystem · local volume · storage appliance</text><text x="1632" y="998" text-anchor="middle" class="s">actual durable bytes live here — not inside the PVC object</text>
<path d="M1365 845 V875 H1632 V905 M1882 845 V875 H1632 V905" class="solid"/>
<text x="1150" y="1080" class="s">PVC is a request · PV is a cluster resource · StorageClass describes provisioning · CSI is the driver interface.</text>
<text x="1150" y="1105" class="s">Attach is backend-dependent; NodeStageVolume is optional; NodePublishVolume exposes the volume to the Pod.</text>

<!-- NETWORK -->
<rect x="45" y="1210" width="1300" height="475" class="zone znet"/>
<text x="75" y="1250" class="cap">SERVICE NETWORKING — DNS DISCOVERY IS NOT PACKET FORWARDING</text>
<rect x="80" y="1300" width="220" height="100" class="box violet"/><text x="190" y="1338" text-anchor="middle" class="h">Client Pod</text><text x="190" y="1368" text-anchor="middle" class="b">asks for api.payments</text>
<rect x="365" y="1300" width="220" height="100" class="box violet"/><text x="475" y="1338" text-anchor="middle" class="h">CoreDNS</text><text x="475" y="1368" text-anchor="middle" class="b">DNS answer = ClusterIP</text>
<rect x="650" y="1300" width="220" height="100" class="box violet"/><text x="760" y="1338" text-anchor="middle" class="h">Service ClusterIP</text><text x="760" y="1368" text-anchor="middle" class="b">virtual IP : servicePort</text>
<rect x="935" y="1300" width="350" height="100" class="box violet"/><text x="1110" y="1338" text-anchor="middle" class="h">kube-proxy OR Cilium eBPF</text><text x="1110" y="1368" text-anchor="middle" class="b">VIP → endpoint forwarding</text>
<path d="M300 1350 H365 M585 1350 H650 M870 1350 H935" class="solid"/>
<rect x="365" y="1460" width="270" height="105" class="box violet"/><text x="500" y="1498" text-anchor="middle" class="h">EndpointSlice</text><text x="500" y="1528" text-anchor="middle" class="b">endpoint IPs / ports / conditions</text><text x="500" y="1548" text-anchor="middle" class="s">managed by control plane</text>
<rect x="735" y="1460" width="300" height="105" class="box violet"/><text x="885" y="1498" text-anchor="middle" class="h">Backend Pod IP:targetPort</text><text x="885" y="1528" text-anchor="middle" class="b">selected ready endpoint</text><text x="885" y="1548" text-anchor="middle" class="s">CNI routes Pod-to-Pod packets</text>
<path d="M1110 1400 V1430 H500 V1460 M635 1510 H735 M1110 1400 V1440 H885 V1460" class="dash"/>
<text x="80" y="1615" class="s">CoreDNS resolves names. EndpointSlice lists eligible backends. kube-proxy/Cilium implements Service datapath. CNI connects Pods.</text>
<text x="80" y="1642" class="s">Headless Service (clusterIP: None): no VIP and no kube-proxy load-balancing; DNS returns Pod endpoint addresses.</text>

<!-- STATEFULSET -->
<rect x="1390" y="1210" width="765" height="475" class="zone zstore"/>
<text x="1420" y="1250" class="cap">STATEFULSET — STABLE POD IDENTITY + CLAIM PER REPLICA</text>
<rect x="1430" y="1300" width="310" height="95" class="box gold"/><text x="1585" y="1337" text-anchor="middle" class="h">Headless Service: ledger</text><text x="1585" y="1366" text-anchor="middle" class="b">clusterIP: None · stable DNS</text>
<rect x="1780" y="1300" width="330" height="95" class="box gold"/><text x="1945" y="1337" text-anchor="middle" class="h">StatefulSet: ledger</text><text x="1945" y="1366" text-anchor="middle" class="b">ordinal Pods + volumeClaimTemplates</text>
<path d="M1740 1347 H1780" class="solid"/>
<rect x="1430" y="1450" width="210" height="85" class="box"/><text x="1535" y="1484" text-anchor="middle" class="h">ledger-0</text><text x="1535" y="1512" text-anchor="middle" class="s">data-ledger-0 → PV A</text>
<rect x="1660" y="1450" width="210" height="85" class="box"/><text x="1765" y="1484" text-anchor="middle" class="h">ledger-1</text><text x="1765" y="1512" text-anchor="middle" class="s">data-ledger-1 → PV B</text>
<rect x="1890" y="1450" width="210" height="85" class="box"/><text x="1995" y="1484" text-anchor="middle" class="h">ledger-2</text><text x="1995" y="1512" text-anchor="middle" class="s">data-ledger-2 → PV C</text>
<path d="M1945 1395 V1420 H1535 V1450 M1945 1420 H1765 V1450 M1945 1420 H1995 V1450" class="dash"/>
<text x="1430" y="1590" class="s">ledger-0.ledger.default.svc.cluster.local</text><text x="1430" y="1615" class="s">StatefulSet does not implement DB quorum, replication or consistency.</text>
<text x="55" y="1715" class="s">Teaching model. Exact runtime, CSI attach behavior, CNI datapath and kube-proxy replacement depend on the cluster distribution and configuration.</text>
</svg>