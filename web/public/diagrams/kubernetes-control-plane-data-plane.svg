<rect x="835" y="675" width="710" height="300" rx="22" fill="#effaf3" stroke="#9bcdae" stroke-width="2"/><text x="865" y="714" class="pill">DATA PLANE / WORKER NODE B</text>
<rect x="870" y="750" width="195" height="92" class="node dp"/><text x="967" y="785" text-anchor="middle" class="title">kubelet</text><text x="967" y="812" text-anchor="middle" class="body">Pod lifecycle agent</text>
<rect x="1100" y="750" width="190" height="92" class="node dp"/><text x="1195" y="785" text-anchor="middle" class="title">CRI runtime</text><text x="1195" y="812" text-anchor="middle" class="body">containerd / CRI</text>
<rect x="1325" y="750" width="185" height="92" class="node dp"/><text x="1417" y="785" text-anchor="middle" class="title">CNI / Cilium</text><text x="1417" y="812" text-anchor="middle" class="body">Pod networking</text>
<path d="M1065 796 H1100 M1290 796 H1325" class="edge"/>
<rect x="870" y="870" width="300" height="75" class="node dp"/><text x="1020" y="900" text-anchor="middle" class="title">Application Pods</text><text x="1020" y="925" text-anchor="middle" class="body">Replicas · endpoints</text>
<rect x="1200" y="870" width="310" height="75" class="node dp"/><text x="1355" y="900" text-anchor="middle" class="title">Node observability</text><text x="1355" y="925" text-anchor="middle" class="body">Events · logs · metrics · Hubble</text>
