apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-network-client
  namespace: warfare-008
spec:
  podSelector:
    matchLabels:
      app: network-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: network-client
      ports:
        - protocol: TCP
          port: 5678
