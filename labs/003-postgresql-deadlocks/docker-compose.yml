services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_only_password
      POSTGRES_DB: warfare
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d warfare"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./sql/setup.sql:/docker-entrypoint-initdb.d/001-setup.sql:ro
      - pg_deadlocks_data:/var/lib/postgresql/data
volumes:
  pg_deadlocks_data:
