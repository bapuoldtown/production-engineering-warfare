apiVersion: v1
kind: Namespace
metadata:
  name: warfare-shutdown-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gist-api
  namespace: warfare-shutdown-lab
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gist-api
  template:
    metadata:
      labels:
        app: gist-api
        version: v1
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: gist-api
          image: gist-graceful:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gist-api
  namespace: warfare-shutdown-lab
spec:
  selector:
    app: gist-api
  ports:
    - port: 80
      targetPort: 8080
