apiVersion: v1
kind: Namespace
metadata:
  name: warfare-006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-start
  namespace: warfare-006
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slow-start
  template:
    metadata:
      labels:
        app: slow-start
    spec:
      containers:
        - name: api
          image: warfare-006:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: STARTUP_SECONDS
              value: "45"
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
