apiVersion: v1
kind: Namespace
metadata:
  name: warfare-008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-api
  namespace: warfare-008
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-api
  template:
    metadata:
      labels:
        app: cpu-api
    spec:
      containers:
        - name: api
          image: warfare-008:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-api
  namespace: warfare-008
spec:
  selector:
    app: cpu-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-api
  namespace: warfare-008
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
