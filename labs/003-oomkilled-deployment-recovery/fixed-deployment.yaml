apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-warrior
  namespace: warfare-oom-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-warrior
  template:
    metadata:
      labels:
        app: oom-warrior
    spec:
      restartPolicy: Always
      containers:
        - name: oom-warrior
          image: python:3.12-slim
          command:
            - python
            - -u
            - -c
            - |
              import time

              # Demonstrate bounded memory usage instead of unbounded growth.
              memory = [bytearray(10 * 1024 * 1024) for _ in range(3)]
              print("Memory stabilized at approximately 30 MiB", flush=True)

              while True:
                  time.sleep(5)
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 80Mi
