apiVersion: v1
kind: Namespace
metadata:
  name: warfare-007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilient-api
  namespace: warfare-007
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resilient-api
  template:
    metadata:
      labels:
        app: resilient-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Mission 007 - Node Failure Recovery"
            - "-listen=:5678"
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: resilient-api
  namespace: warfare-007
spec:
  type: ClusterIP
  selector:
    app: resilient-api
  ports:
    - port: 80
      targetPort: 5678
