apiVersion: v1
kind: Namespace
metadata:
  name: warfare-007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-survivor
  namespace: warfare-007
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-survivor
  template:
    metadata:
      labels:
        app: node-survivor
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: node-survivor
  namespace: warfare-007
spec:
  selector:
    app: node-survivor
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: node-survivor
  namespace: warfare-007
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: node-survivor
